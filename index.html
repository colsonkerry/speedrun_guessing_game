    </head>
    
    <body>

        <h1>SpeedrunGuesser</h1>
        <h2>Which game has the faster speedrun?</h2>

        <div class="container">
            <div class="cards">
                <article class="card">
                    <header>
                        <!-- <h3>Game #1</h3> -->
                    </header>
                    <button class="game-option" id="left-button">
                        <img id="left-button-image" class="button-image" src="" alt="Game Selection">
                        <span id="left-button-text" class="button-text"></span>
                        <span id="left-game-category" class="game-category"></span>
                        <span id="left-game-time" class="game-time hidden"></span>
                    </button>
                </article>

                <article class="card">
                    <header>
                        <!-- <h3>Game #2</h3> -->
                    </header>
                    <button class="game-option" id="right-button">
                        <img id="right-button-image" class="button-image" src="" alt="Game Selection">
                        <span id="right-button-text" class="button-text"></span>
                        <span id="right-game-category" class="game-category"></span>
                        <span id="right-game-time" class="game-time hidden"></span>
                    </button>
                </article>
            </div>
        </div>

        <div class="result">
            <h2 id="correct-or-incorrect"></h2>;
        </div>
        <div class="next">
            <button id="next-button" class="button-30 hidden" role="button">Next</button>
        </div>
        

        <script type="module" src ="js/main.js"></script>

    </body>
