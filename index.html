        <div class="cards">
            <article class="card">

                    <span id="left-button-text" class="button-text">Elden Ring</span>
                    <span id="left-game-time" class="game-time">3105 seconds</span>
                </button>
            </article>

            <article class="card">
                <header>
                    <h2>Game #2</h2>
                </header>
                <button class="game-option" id="right-button">
                    <img id="right-button-image" class="button-image" src="images/dark_souls_iii.png" alt="Game Selection">
                    <span id="right-button-text" class="button-text">Dark Souls III</span>
                    <span id="right-game-time" class="game-time">1482 seconds</span>
