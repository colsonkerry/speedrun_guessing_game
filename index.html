<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Page Title</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    
    <body>
        
        <header class="title-panel">
            <h1>SpeedrunGuesser</h1>
            <h2>Which game has the faster speedrun?</h2>
        </header>

        <div class="container">
            <div class="cards">
                <article class="card" id="left-card">
                    <button class="game-option" id="left-button">
                        <img id="left-button-image" class="button-image" src="" alt="Game Selection">
                        <span id="left-button-text" class="button-text"></span>
                        <span id="left-game-category" class="game-category"></span>
                        <span id="left-game-time" class="game-time hidden"></span>
                    </button>
                </article>

                <div class="versus">
                    <div class="versus-badge">VS</div>
                    <div class="score">
                        <span class="score-square"></span>
                        <span class="score-square"></span>
                        <span class="score-square"></span>
                        <span class="score-square"></span>
                        <span class="score-square"></span>
                    </div>
                    <div class="result">
                        <h2 id="correct-or-incorrect"></h2>
                    </div>
                    <div class="next">
                        <button id="next-button" class="button-30 hidden" role="button">Next</button>
                    </div>
                </div>

                <article class="card" id="right-card">
                    <button class="game-option" id="right-button">
                        <img id="right-button-image" class="button-image" src="" alt="Game Selection">
                        <span id="right-button-text" class="button-text"></span>
                        <span id="right-game-category" class="game-category"></span>
                        <span id="right-game-time" class="game-time hidden"></span>
                    </button>
                </article>
            </div>
        </div>

        <dialog id="instructions-modal" class="instructions-modal">
            <div class="instructions-content">
                <h2>How to Play</h2>
                <ul>
                    <li>Two games appear side by side, each with its speedrun category.</li>
                    <li>Click the game you think has the <strong>faster</strong> speedrun time.</li>
                    <li>5 rounds, how many can you get right?</li>
                </ul>
                <button id="start-game-button" class="button-30" role="button">Let's Go!</button>
            </div>
        </dialog>

        <dialog id="results-screen" class="results-screen">
            <div class="results-content">
                
            </div>
        </dialog>
        
        <script type="module" src ="js/main.js"></script>

    </body>
</html>
